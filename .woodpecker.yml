steps:
  - name: checks
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    commands:
      - npm ci
      - npm run ci

  - name: deploy-codeberg-pages
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    environment:
      CODEBERG_USERNAME:
        from_secret: codeberg_username
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - npm ci
      - CODEBERG_PAGES=true npm run build
      - git config --global user.name "Woodpecker CI"
      - git config --global user.email "woodpecker@codeberg.org"
      - export PAGES_REMOTE="https://$${CODEBERG_USERNAME}:$${CODEBERG_TOKEN}@codeberg.org/$${CI_REPO}.git"
      - git clone --branch pages --depth 1 "$${PAGES_REMOTE}" .pages || git clone --depth 1 "$${CI_REPO_CLONE_URL}" .pages
      - git -C .pages checkout --orphan pages-build
      - find .pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
      - cp -a dist/. .pages/
      - git -C .pages add --all
      - |
        if git -C .pages diff --cached --quiet; then
          echo "No Codeberg Pages changes to publish."
        else
          git -C .pages commit -m "Deploy site from $${CI_COMMIT_SHA}"
          git -C .pages push "$${PAGES_REMOTE}" HEAD:pages --force
        fi
    when:
      - event: push
        branch: master
